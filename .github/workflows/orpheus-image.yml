# Builds Iriis' Orpheus voice image and publishes it to GitHub's container registry (free):
#   ghcr.io/<owner>/iriis-orpheus:latest
# Runs when deploy/orpheus_server changes, or by hand (Actions tab -> "Orpheus voice image" -> Run workflow).
name: Orpheus voice image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["deploy/orpheus_server/**", ".github/workflows/orpheus-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the vLLM base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iriis-orpheus" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: deploy/orpheus_server
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
