# MCP servers Iriis connects to. Shape follows the common `mcpServers` format, plus:
#   enabled        start this server?
#   transport      stdio (default; launches `command args`) or http (streamable HTTP, url: ...)
#   tier           default permission tier for this server's tools: auto | confirm | blocked
#   tools          per-tool tier overrides (globs allowed), e.g. {write_*: confirm}
#   description    one line, used by the tool router to pick servers when there are many tools
#   keywords       extra words that route a request to this server
#   needs_internet document that this server can't work offline (it is allowed to be down)
#
# `command: python` runs inside Iriis' own virtualenv. Tool names reach the LLM as server__tool.
# Any tool not covered here gets permissions.default_tier from config.yaml (confirm).

mcpServers:
  time_and_calc:
    command: python
    args: ["-m", "servers.time_and_calc"]
    tier: auto
    description: Current time and date, timezones, date differences, maths, unit conversion.
    keywords: [time, date, day, clock, calculate, plus, minus, times, divided, percent, convert, units, timezone]

  system_info:
    command: python
    args: ["-m", "servers.system_info"]
    tier: auto
    description: This computer's CPU, memory, disk space, battery, uptime, running processes and network.
    keywords: [computer, laptop, pc, cpu, ram, memory, disk, storage, space, battery, process, running, network, wifi, internet, uptime, slow,
               open, opened, windows, window, tabs, tab, brave, chrome, edge, firefox, word, excel, screen, apps, programs, playing, watching]

  files:
    command: python
    args: ["-m", "servers.files"]
    tier: auto            # reading and searching inside allowlisted folders
    tools:
      write_text_file: confirm
      move_file: confirm
      delete_file: confirm
      open_file: auto
    description: Search, list, read and open files in the allowed folders; write, move or delete files with confirmation.
    keywords: [file, files, folder, document, documents, downloads, desktop, pdf, find, search, open, read, save, write, move, rename, delete]

  shell:
    command: python
    args: ["-m", "servers.shell"]
    tier: confirm         # the shell classifier relaxes allowlisted read-only commands to auto
    description: Run terminal commands (read-only commands run directly, others need confirmation).
    keywords: [command, terminal, shell, run, git, ping, powershell, cmd, directory]

  apps_and_media:
    command: python
    args: ["-m", "servers.apps_and_media"]
    tier: auto
    tools:
      close_app: confirm
      lock_screen: confirm
      open_url: confirm
      power: confirm
    description: Open or close applications, volume, media playback, screenshots, lock screen, open websites.
    keywords: [open, launch, start, close, quit, app, application, volume, louder, quieter, mute, music, play, pause, next, previous, song, screenshot, lock, browser, website]

  notes_reminders:
    command: python
    args: ["-m", "servers.notes_reminders"]
    tier: auto
    tools:
      delete_note: confirm
    description: Notes, reminders and countdown timers stored locally.
    keywords: [note, notes, write down, jot, remind, reminder, reminders, timer, alarm, minutes, schedule]

  clipboard:
    command: python
    args: ["-m", "servers.clipboard"]
    tier: auto
    tools:
      write_clipboard: confirm
    description: Read or set the clipboard text.
    keywords: [clipboard, copy, copied, paste]

  memory:
    command: python
    args: ["-m", "servers.memory"]
    tier: auto
    description: Long-term facts the user asked to remember (save, recall, forget) and search of past conversations.
    keywords: [remember, recall, forget, memory, my, conversation, talked, said, told, earlier, yesterday, last, week, discussed, mentioned]

  # ------------------------------------------------------------------------------------------
  # Optional third-party servers (disabled). Install their runtimes first; see README §MCP.

  fs_reference:          # reference filesystem server (Node.js). Needs `npx`.
    enabled: false
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/you/Documents"]
    tier: confirm
    tools: {read_*: auto, list_*: auto, search_*: auto, get_*: auto}
    description: Reference filesystem server.

  git:                   # reference git server (Python): pip install mcp-server-git
    enabled: false
    command: python
    args: ["-m", "mcp_server_git", "--repository", "C:/path/to/repo"]
    tier: confirm
    tools: {git_status: auto, git_log: auto, git_diff*: auto, git_show: auto}
    description: Git repository status, history and diffs.
    keywords: [git, commit, branch, repo, repository, diff]

  browser:               # Playwright MCP (Node.js): drives the user's OWN Chrome through the Playwright Extension
    enabled: true
    needs_internet: true
    command: npx
    # Your everyday Chrome, with your logins (Gmail, WhatsApp Web...). One-time setup: install the "Playwright
    # Extension" (chromewebstore.google.com/detail/playwright-extension/mmlmfjhmonkocbjadbfplnigmagldckm), open
    # it, copy its token into .env as PLAYWRIGHT_MCP_EXTENSION_TOKEN (then she connects without asking each time).
    # For a separate profile instead, replace "--extension" with "--browser", "chrome".
    args: ["-y", "@playwright/mcp@0.0.83", "--extension", "--output-dir", "data/playwright"]
    env: {PLAYWRIGHT_MCP_EXTENSION_TOKEN: "${PLAYWRIGHT_MCP_EXTENSION_TOKEN}"}
    tier: auto             # navigate, read, click, type, tabs...
    tools:
      browser_fill_form: confirm
      browser_file_upload: confirm      # sends files from your PC to a website
      browser_drop: confirm
      browser_handle_dialog: confirm
      browser_evaluate: confirm         # runs JavaScript on the page
      browser_run_code_unsafe: blocked
      browser_network_request: blocked  # full request details can contain passwords / cookies
    exclude: [browser_emulate_media, browser_resize, browser_console_messages, browser_network_requests, browser_drag]
    description: Drive a real web browser on the user's computer - open sites, read them, click, type, fill forms, tabs.
    keywords: [browser, browse, website, site, page, open, click, login, form, tab, chrome, youtube, google, buy, book, check, fill, sign,
               whatsapp, message, messages, messaged, texted, chat, chats, dm, reply, unread, group, instagram, facebook, twitter, x,
               linkedin, tiktok, notion, docs, sheets, drive, portal, dashboard, account, bank, online, web, app]

  web:                   # fast web search + page reading (no browser window, no API key)
    command: python
    args: ["-m", "servers.web"]
    env: {TAVILY_API_KEY: "${TAVILY_API_KEY}", BRAVE_API_KEY: "${BRAVE_API_KEY}"}   # optional free tiers
    needs_internet: true
    tier: auto
    description: Search the web and read web pages as text - news, facts, prices, docs, anything current.
    keywords: [search, google, look, find, web, internet, online, news, latest, today, price, weather, who, what, website, article, read, link, url]

  seryn:                 # Seryn Twin on Railway (remote MCP): cited PCM / liner / produce database, models, lab
    # Runs from the cloud core, so it works with your computer off and nothing about Seryn lives on this PC.
    # Set SERYN_API_KEY (one of the twin's SERYN_API_KEYS, or its app password) where Iriis runs.
    transport: http
    url: https://seryn-twin-production.up.railway.app/mcp
    headers: {Authorization: "Bearer ${SERYN_API_KEY}"}
    requires_env: [SERYN_API_KEY]
    needs_internet: true
    tier: auto             # read-only lookups
    tools:
      seryn_confirm_value: confirm   # writes to the property database: always ask first
      seryn_notebook_add: confirm
    description: Seryn Labs expert tools - PCM cold packs, Glauber's salt blends, paraffins, HDPE casings, crate liners, insulation, produce storage, lab protocols, hazards, Nairobi weather, whole designs. Every value cited.
    keywords: [seryn, pack, packs, pcm, phase, melt, melting, freeze, freezing, glauber, sulfate, sulphate, salt, borax, cmc, paraffin, wax, alkane, tetradecane, pentadecane, hexadecane, hdpe, casing, liner, crate, cooler, lid, insulation, eps, vip, foam, tomato, tomatoes, avocado, mango, banana, produce, chilling, recipe, latent, supercooling, nucleator, cold, chill, cool, lab, protocol, test, hazard, headspace]

  tasks:                 # background jobs and routines (run by the cloud core; see iriis/agent/tasks.py)
    command: python
    args: ["-m", "servers.tasks"]
    tier: auto
    tools: {cancel_task: auto, cancel_call: auto}
    description: Hand Iriis bigger jobs to do in the background (research, comparisons, drafting, monitoring) and routines that repeat (morning briefing, daily email check); list them and read their reports. Phone the user - alarms, wake-up calls, call-me-at reminders (the app rings like a call).
    keywords: [task, tasks, background, routine, routines, every, daily, morning, briefing, research, compare, comparison, find out, look into, investigate, report, later, monitor, schedule, weekly, alarm, alarms, wake, wake up, call, call me, ring, phone]

  google:                # Gmail + Google Calendar (cloud; connect once with: iriis google-login client.json)
    command: python
    args: ["-m", "servers.google"]
    needs_internet: true
    tier: auto             # reading, searching, drafting
    tools:
      gmail_send_draft: confirm
      gmail_mark: confirm
      calendar_create: confirm
      calendar_update: confirm
      calendar_delete: confirm
    description: The user's Gmail (search, read, draft replies, send with confirmation) and Google Calendar (agenda, free time, add/change/delete events).
    keywords: [email, emails, mail, gmail, inbox, unread, reply, draft, send, message, wrote, calendar, meeting, meetings, event, events, schedule, appointment, agenda, free, busy, invite, tomorrow, today, week]

  documents:             # Word / Excel / PDF / PowerPoint on the user's PC (allowed folders only)
    command: python
    args: ["-m", "servers.documents"]
    env: {IRIIS_SERVER_URL: "${IRIIS_SERVER_URL}", IRIIS_API_KEY: "${IRIIS_API_KEY}"}   # save_from_cloud
    tier: auto             # new files; replacing an existing file (overwrite=true) asks first
    tools: {append_to_spreadsheet: confirm}
    description: Create Word documents, Excel spreadsheets, PDFs and PowerPoint presentations, append rows to spreadsheets, and read docx, xlsx, csv, pptx, pdf, txt and md files in the allowed folders.
    keywords: [document, documents, word, docx, excel, spreadsheet, xlsx, sheet, csv, pdf, powerpoint, pptx, presentation, slides, deck, report, letter, memo, table, invoice, write up, proposal, cv]

  money:                 # personal + business money tracker in KES, M-Pesa SMS import (cloud database)
    command: python
    args: ["-m", "servers.money"]
    tier: auto
    tools:
      delete_transaction: confirm
      update_transaction: confirm
    description: Personal and business money tracker in KES (expenses, income, M-Pesa SMS import, budgets, summaries, CSV export), stored in the cloud database.
    keywords: [money, spend, spent, spending, expense, expenses, budget, budgets, mpesa, m-pesa, income, sales, sold, paid, pay, payment, ksh, kes, shillings, bob, cost, costs, bought, received, transaction, transactions, till, paybill, withdraw, airtime, rent, salary, profit, balance, finances, export]

  self:                  # Iriis reads her own deployed code, live status and recent changes (cloud)
    command: python
    args: ["-m", "servers.self_knowledge"]
    env: {PORT: "${PORT}", IRIIS_API_KEY: "${IRIIS_API_KEY}", RAILWAY_GIT_COMMIT_SHA: "${RAILWAY_GIT_COMMIT_SHA}",
          RAILWAY_GIT_COMMIT_MESSAGE: "${RAILWAY_GIT_COMMIT_MESSAGE}"}
    tier: auto             # read-only
    description: How Iriis herself works and what she can do right now - her skills, where each runs, what is connected, her own code and recent changes.
    keywords: [you, your, yourself, how, work, works, built, made, access, capabilities, skills, abilities, able, can, connected, code, version, update, updated, changed, new, features, setup, architecture, iriis]

  studio:                # charts, diagrams and documents made in the cloud; sent to Telegram or saved to the PC
    command: python
    args: ["-m", "servers.studio"]
    env: {TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}", TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}",
          VISION_MCP_URL: "${VISION_MCP_URL}", VISION_ACCESS_KEY: "${VISION_ACCESS_KEY}",
          GROQ_API_KEY: "${GROQ_API_KEY}", GEMINI_API_KEY: "${GEMINI_API_KEY}", PORT: "${PORT}", IRIIS_API_KEY: "${IRIIS_API_KEY}"}
    tier: auto             # making files; send_file goes only to the user's own Telegram
    description: Make charts and graphs, maths plots, hand-drawn sketches and drawings, diagrams (flowcharts, org charts, mind maps, processes) and documents (PDF, Word, Excel, PowerPoint, with pictures inside); take a photo from the live camera; open and read files the user sends (PDFs, documents, pictures, audio, video); send files to Telegram.
    keywords: [chart, charts, graph, graphs, plot, diagram, diagrams, flowchart, flow, mind map, org chart, visual, visualise, visualize, draw, drawing, sketch, illustrate, explain, function, equation, maths, math, curve, picture, image, photo, pdf, document, report, summary, slides, presentation, deck, spreadsheet, excel, word, send, telegram, file, files, attachment, attached, sent, voice note, audio, video, camera, see, saw]

  hq:                    # Iriis HQ, Amschel's chief of staff (iriis.riftfi.com) over remote MCP; on when the key is set
    transport: http
    url: https://iriis.riftfi.com/mcp
    headers: {Authorization: "Bearer ${IRIIS_HQ_KEY}"}
    requires_env: [IRIIS_HQ_KEY]
    needs_internet: true
    tier: auto             # reading is free; anything that reaches people or changes the world asks first
    tools: {linkedin_outreach: confirm, job_applications: confirm, x_social: confirm, send_email: confirm,
            send_draft: confirm, cancel_draft: confirm, send_for_signature: confirm, cancel_calendly_meeting: confirm,
            close_case_and_reply_to_user: confirm, notify_affected_users: confirm, notify_provider_group: confirm,
            notify_team: confirm, email_admin_team: confirm, escalate_to_team: confirm, flag_provider_issue: confirm,
            open_ticket: confirm, run_routine: confirm, forget_memory: confirm, save_teaching: confirm,
            retire_teaching: confirm}
    description: Iriis HQ, the user's chief of staff for all his ventures (Jahazi, Seryn Labs, Rift, consulting, his job search) - ventures' status, goals, numbers and decisions; his documents library; contacts and who to talk to; his promises and to-dos (what's overdue); fundraising rounds and investors; deep research reports; job applications and LinkedIn outreach; how he writes (my_voice). ask_iriis hands HQ a whole question.
    keywords: [hq, chief of staff, venture, ventures, jahazi, rift, seryn, consulting, job, jobs, job search, application, applications, linkedin, outreach, investor, investors, fundraising, raise, round, pitch, deck, contact, contacts, people, who, talk to, commitment, commitments, promise, promised, todo, to-do, overdue, library, document, documents, research, report, capital, intel, inbox, today, priorities, my voice, write as me]

  bench:                 # Seryn Vision (the bench camera assistant) over remote MCP; on when both are set
    transport: http
    url: ${VISION_MCP_URL}          # e.g. https://<iriis-visual domain>/mcp, or http://localhost:8000/mcp
    headers: {Authorization: "Bearer ${VISION_ACCESS_KEY}"}
    requires_env: [VISION_MCP_URL, VISION_ACCESS_KEY]
    needs_internet: true
    tier: auto
    tools: {bench_start_procedure: confirm}
    description: The user's workbench camera (their phone) - what it sees right now, instrument readings, snapshot, goal and step-by-step procedures, coach mode, and reviews of what happened in recent minutes or recorded videos.
    keywords: [bench, workbench, camera, see, looking, look, watch, reading, thermometer, gauge, dial, solder, soldering, build, assembly, procedure, step, coach, recording, video, happened, snapshot, picture]

  # Unofficial messaging/social bridges: NEED INTERNET, may break, and risk account bans.
  # Read-mostly; every send/post tool stays at confirm. Their credentials live in their own env.
  whatsapp:              # e.g. a WAHA (whatsapp-web.js / Baileys) MCP bridge on localhost
    enabled: false
    needs_internet: true
    transport: http
    url: http://127.0.0.1:3010/mcp
    tier: confirm
    tools: {list_*: auto, get_*: auto, read_*: auto, search_*: auto}
    description: Read and (with confirmation) send WhatsApp messages.
    keywords: [whatsapp, message, messages, chat, text, send]

  x_twitter:             # e.g. an MCP server wrapping twikit
    enabled: false
    needs_internet: true
    command: python
    args: ["-m", "my_x_mcp_server"]
    env: {X_COOKIES_FILE: "C:/Users/you/.config/x/cookies.json"}
    tier: confirm
    tools: {get_*: auto, search_*: auto, read_*: auto}
    description: Read X/Twitter timeline and (with confirmation) post.
    keywords: [twitter, tweet, x, timeline, post]

  instagram:             # e.g. an MCP server wrapping instagrapi
    enabled: false
    needs_internet: true
    command: python
    args: ["-m", "my_instagram_mcp_server"]
    tier: confirm
    tools: {get_*: auto, list_*: auto}
    description: Read Instagram DMs and feed; posting needs confirmation.
    keywords: [instagram, insta, dm]

  linkedin:              # e.g. an MCP server wrapping linkedin-api
    enabled: false
    needs_internet: true
    command: python
    args: ["-m", "my_linkedin_mcp_server"]
    tier: confirm
    tools: {get_*: auto, search_*: auto}
    description: Read LinkedIn messages and profiles; sending needs confirmation.
    keywords: [linkedin]
